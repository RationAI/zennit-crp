<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Residual skip vs branch — LRP relevance flow (4 models)</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; flex-direction: column;
        font-family: system-ui, sans-serif;
        background: #f9f9f7; color: #0b0b0b;
      }
      header {
        display: flex; align-items: center; gap: 14px;
        padding: 10px 18px; border-bottom: 1px solid #e1e0d9;
        background: #fcfcfb; flex-wrap: wrap;
      }
      header h1 { font-size: 15px; margin: 0; font-weight: 600; }
      header span.sub { color: #52514e; font-size: 12px; }
      select {
        font: inherit; font-size: 13px; padding: 4px 8px;
        border: 1px solid #c3c2b7; border-radius: 6px;
        background: #fcfcfb; color: #0b0b0b;
      }
      iframe { flex: 1; width: 100%; border: 0; background: #f9f9f7; }
    </style>
  </head>
  <body>
    <header>
      <h1>Residual skip vs branch — LRP relevance flow</h1>
      <label for="model" class="sub">model:</label>
      <select id="model">
        <option value="m1_vit_small_fb.html" selected>M1 — ViT-S/16 · FunnyBirds (finetuned probe)</option>
        <option value="m2_vit_base_in.html">M2 — ViT-B/16 · ImageNet-1k (timm pretrained)</option>
        <option value="m3_dinov3s_fb.html">M3 — DINOv3-S/16 · FunnyBirds (finetuned probe)</option>
        <option value="m4_dinov3b_in.html">M4 — DINOv3-B/16 · ImageNet-1k (canvit CLS linear head)</option>
      </select>
      <span class="sub">cp_lrp_baseline · N=96 class-diverse correctly-classified · seed 0 · patch tokens only</span>
    </header>
    <iframe id="page" src="m1_vit_small_fb.html" title="per-model residual flow page"></iframe>
    <script>
      document.getElementById("model").addEventListener("change", function () {
        document.getElementById("page").src = this.value;
      });
    </script>
  </body>
</html>
