[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zennit-crp"
version = "0.6.0+vit"
description = "Concept Relevance Propagation and Relevance Maximization (Vision Transformer extension fork)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause-Clear"}
authors = [
  {name = "Reduan Achtibat"},
]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "zennit>=0.5.1",
  "torch>=2.1",
  "numpy>=1.24",
  "tqdm",
  "matplotlib",
  "timm>=1.0.26",
  "pillow>=12.2.0",
  "lightning>=2.0",
  "torchmetrics>=1.0",
  "typer>=0.12",
  "huggingface-hub>=1.12.0",
  "pyarrow>=24.0.0",
  "torchvision>=0.26.0",
  "jupyter>=1.1.1",
  "ipykernel>=7.2.0",
  "ipywidgets>=8.1.8",
  "nbformat>=5.10.4",
  "nbconvert>=7.17.1",
]

[project.optional-dependencies]
fast_img = ["Pillow-SIMD"]
# `timm` and `Pillow` are now in main `dependencies` (timm is the only
# supported ViT backend; Pillow is imported by crp.cache + crp.image).
# The `vit` extra now only pulls the HuggingFace `transformers` library —
# left optional pending a multi-architecture canonizer milestone.
vit = [
  "transformers>=4.40",
]
dev = [
  "pytest>=8",
  "pytest-cov",
  "ruff",
]

[project.urls]
Homepage = "https://github.com/RationAI/zennit-crp"

[tool.setuptools.packages.find]
include = ["crp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
