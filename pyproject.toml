[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zennit-crp"
version = "0.6.0+vit"
description = "Concept Relevance Propagation and Relevance Maximization (Vision Transformer extension fork)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause-Clear"}
authors = [
  {name = "Reduan Achtibat"},
]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "zennit>=0.5.1",
  "torch>=2.1",
  "numpy>=1.24",
  "tqdm",
  "matplotlib",
]

[project.optional-dependencies]
fast_img = ["Pillow-SIMD"]
vit = [
  "timm>=1.0",
  "transformers>=4.40",
  "Pillow",
]
dev = [
  "pytest>=8",
  "pytest-cov",
  "ruff",
]
notebook = [
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "jupyter>=1.1.1",
    "nbclient>=0.10.4",
    "torchvision>=0.26.0",
]

[project.urls]
Homepage = "https://github.com/RationAI/zennit-crp"

[tool.setuptools.packages.find]
include = ["crp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
